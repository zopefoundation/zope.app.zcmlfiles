# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "zope.app.zcmlfiles"
version = "6.1.dev0"
description = "Zope application server ZCML files"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation and contributors",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "zope.annotation >= 4.4.1",
    "zope.component >= 4.3.0",
    "zope.componentvocabulary >= 2.0.0",
    "zope.copypastemove >= 4.0.0",
    "zope.dublincore >= 4.1.1",
    "zope.formlib >= 4.3.0",
    "zope.i18n >= 4.2.0",
    "zope.location >= 4.0.3",
    "zope.publisher >= 4.3.2",
    "zope.size >= 4.1.0",
    "zope.traversing >= 4.1.0",
    "zope.app.applicationcontrol >= 4.0.0",
    "zope.app.appsetup >= 4.0.0",
    "zope.app.basicskin >= 4.0.0",
    "zope.app.broken >= 4.0.0",
    "zope.app.component >= 4.0.0",
    "zope.app.container >= 4.0.0",
    "zope.app.content >= 4.0.0",
    "zope.app.dependable >= 4.0.0",
    "zope.app.error >= 4.0.0",
    "zope.app.exception >= 4.0.1",
    "zope.app.folder >= 4.0.0",
    "zope.app.form >= 5.0.0",
    "zope.app.generations >= 4.0.0",
    "zope.app.http >= 4.0.1",
    "zope.app.i18n >= 4.0.0",
    "zope.app.locales >= 4.0.0",
    "zope.app.pagetemplate >= 4.0.0",
    "zope.app.principalannotation >= 4.0.0",
    "zope.app.publication >= 4.2.1",
    "zope.app.publisher >= 4.0.0",
    "zope.app.rotterdam >= 4.0.0",
    "zope.app.schema >= 4.1.0",
    "zope.app.security >= 4.0.0",
    "zope.app.wsgi >= 4.1.0",
]
keywords = [
    "zope",
    "setup",
    "configuration",
    "standard",
    "menu",
]

[project.optional-dependencies]
test = [
    "webtest",
    "zope.testing",
    "zope.testrunner >= 6.4",
]

[project.urls]
Source = "http://github.com/zopefoundation/zope.app.zcmlfiles"
Issues = "https://github.com/zopefoundation/zope.app.zcmlfiles/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/zope.app.zcmlfiles/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["zope.app.zcmlfiles"]

[tool.coverage.report]
fail_under = 100
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

